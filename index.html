<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ressursfordeling – tidslinje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   DESIGN TOKENS – NORMA Geosystems palette (norma-gs.no/styles.css)
   ========================================================== */
:root{
  --anthracite:#383E42; --anthracite-2:#2D3236; --anthracite-3:#22272A;
  --yellow:#F4BB29; --yellow-deep:#D9A21A;
  --bg:#FFFFFF; --alt:#F5F5F5; --surface:#FFFFFF;
  --text:#383E42; --muted:#666666; --line:#E5E5E5;
  --accent-ink:var(--yellow-deep);
  --r1:#383E42; --r1-ink:#FFFFFF;          /* Resource 1 – anthracite */
  --r2:#F4BB29; --r2-ink:#383E42;          /* Resource 2 – yellow */
  --r3:#8A9399; --r3-ink:#FFFFFF;          /* Resource 3 – graphite */
  --shared:#B9BEC2; --shared-2:#D3D6D9; --shared-ink:#383E42;
  --p1-bg:rgba(244,187,41,.16); --p1-ink:#383E42;
  --p2-bg:#383E42; --p2-ink:#FFFFFF;
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --label-w:230px; --tl-minw:960px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#22272A;--alt:#2D3236;--surface:#2D3236;--text:#FFFFFF;--muted:rgba(255,255,255,.65);--line:rgba(255,255,255,.1);
    --accent-ink:var(--yellow);--r1:#DADDDF;--r1-ink:#22272A;--r3:#7C858B;--shared:#4A5257;--shared-2:#3E454A;--shared-ink:#FFFFFF;
    --p1-ink:#FFFFFF;--p2-bg:#DADDDF;--p2-ink:#22272A;
  }
}
:root[data-theme="dark"]{
  --bg:#22272A;--alt:#2D3236;--surface:#2D3236;--text:#FFFFFF;--muted:rgba(255,255,255,.65);--line:rgba(255,255,255,.1);
  --accent-ink:var(--yellow);--r1:#DADDDF;--r1-ink:#22272A;--r3:#7C858B;--shared:#4A5257;--shared-2:#3E454A;--shared-ink:#FFFFFF;
  --p1-ink:#FFFFFF;--p2-bg:#DADDDF;--p2-ink:#22272A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}

/* Nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid #E5E5E5}
.nav .wrap{display:flex;align-items:center;gap:16px;height:72px}
.nav img{height:44px;width:auto;display:block}
.nav .sp{flex:1}
.seg{display:inline-flex;border:1.5px solid #383E42}
.seg button{background:transparent;color:#383E42;border:0;padding:7px 12px;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.02em}
.seg button+button{border-left:1.5px solid #383E42}
.seg button[aria-pressed="true"]{background:#383E42;color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:rgba(244,187,41,.25)}

/* Hero */
.hero{background:var(--anthracite);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;opacity:.07;pointer-events:none;
  background:repeating-radial-gradient(ellipse at 80% 120%,transparent 0 38px,#fff 39px 40px)}
.hero .wrap{position:relative;padding-top:56px;padding-bottom:0}
.badge-live{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);padding:8px 14px;border:1px solid rgba(244,187,41,.4);background:rgba(244,187,41,.06)}
.badge-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px rgba(244,187,41,.18);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(244,187,41,.18)}50%{box-shadow:0 0 0 8px rgba(244,187,41,.04)}}
@media (prefers-reduced-motion:reduce){.badge-live::before{animation:none}}
.hero h1{font-size:clamp(34px,5vw,68px);line-height:1.02;margin:26px 0 20px;text-transform:uppercase;text-wrap:balance}
.hero h1 .accent{color:var(--yellow)}
.hero p{max-width:620px;margin:0;color:rgba(255,255,255,.65);font-size:clamp(15px,1.2vw,18px)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-top:44px;border-top:1px solid rgba(255,255,255,.1)}
.kpi{padding:24px 24px 30px 0}
.kpi+.kpi{padding-left:24px;border-left:1px solid rgba(255,255,255,.1)}
.kpi .l{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.kpi .v{font-family:var(--font-display);font-size:clamp(34px,4vw,48px);font-weight:500;color:var(--yellow);line-height:1.1;margin-top:8px}
.kpi .v small{font-size:16px;color:rgba(255,255,255,.55)}
.kpi .s{font-size:13px;color:rgba(255,255,255,.65)}

/* Sections */
.section{padding:56px 0}
.section.gray{background:var(--alt)}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink);display:inline-flex;align-items:center;gap:10px;margin-bottom:12px}
.eyebrow::before{content:"";width:24px;height:1px;background:currentColor}
.sec-title{font-size:clamp(26px,3vw,38px);line-height:1.08}
.card{background:var(--surface);border:1px solid var(--line)}

/* Timeline */
.tl-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{width:12px;height:12px;display:inline-block}
.tl{padding:20px 0 8px}
.scroll{overflow-x:auto;padding:0 20px 6px}
.grid{min-width:var(--tl-minw);display:grid;grid-template-columns:var(--label-w) 1fr;position:relative}
.lab{padding:0 12px 0 0;display:flex;align-items:center;font-size:13.5px;min-height:34px;position:sticky;left:0;background:var(--surface);z-index:3}
.track{position:relative;min-height:34px;border-left:1px solid var(--line)}
.lab.row-sep,.track.row-sep{border-top:1px solid var(--line)}
.track.years,.track.months{display:flex}
.track.years div,.track.months div{border-right:1px solid var(--line);text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.track.years div{font-family:var(--font-display);font-weight:600;color:var(--text);font-size:14px;padding:6px 0}
.track.months div{padding:3px 0}
.track.periods{min-height:32px}
.pband{position:absolute;top:4px;bottom:4px;font-size:11px;font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;cursor:pointer;border:0}
.pband.p1{background:var(--p1-bg);color:var(--p1-ink);border-left:3px solid var(--yellow)}
.pband.p2{background:var(--p2-bg);color:var(--p2-ink);border-left:3px solid var(--yellow)}
.pband.open{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.lab.group{font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--text);text-transform:uppercase;letter-spacing:.18em;padding-top:12px;min-height:40px}
.lab.group .dot{width:10px;height:10px;margin-right:10px;flex:none}
.track.group{border-left-color:transparent}
.lab.lane{padding-left:20px;color:var(--text)}
.bar{position:absolute;top:6px;height:22px;border:0;padding:0 8px;font-family:var(--font-display);font-size:12px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .12s,box-shadow .12s,opacity .2s}
.bar:hover,.bar:focus-visible{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.18);outline:none}
.bar.sel{outline:2px solid var(--yellow-deep);outline-offset:2px}
.bar.open{-webkit-mask-image:linear-gradient(90deg,#000 88%,rgba(0,0,0,.25));mask-image:linear-gradient(90deg,#000 88%,rgba(0,0,0,.25))}
.bar.dim{opacity:.25}
.bar .tag{background:var(--yellow);color:#383E42;padding:0 5px;margin-left:6px;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em}
.bar.shared{background:repeating-linear-gradient(135deg,var(--shared) 0 10px,var(--shared-2) 10px 20px)!important}
.vline{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--muted);pointer-events:none;z-index:2}
.vline.today{border-left:2px solid var(--text)}
.vline.today span{position:absolute;top:2px;left:-50px;width:46px;text-align:right;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);white-space:nowrap}
.cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--yellow);z-index:4;pointer-events:none}
.cursor::before{content:"";position:absolute;top:-5px;left:-5px;width:12px;height:12px;background:var(--yellow);box-shadow:0 0 0 3px var(--surface)}
.overlay{position:absolute;inset:0;pointer-events:none}
.scrub{display:grid;grid-template-columns:var(--label-w) 1fr;min-width:var(--tl-minw);align-items:center;margin-top:8px}
.scrub label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:sticky;left:0;background:var(--surface)}
input[type=range]{width:100%;accent-color:var(--yellow-deep);margin:0}
.hint{font-size:12.5px;color:var(--muted);padding:8px 20px 10px}

/* Lower area */
.lower{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start}
.panel{padding:24px}
.panel h2{font-size:22px;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-left:3px solid var(--yellow)}
.pill.p1{background:var(--p1-bg);color:var(--p1-ink)}
.pill.p2{background:var(--p2-bg);color:var(--p2-ink)}
.res{border:1px solid var(--line);margin-bottom:14px}
.res-h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.role{padding:12px 14px;border-top:1px solid var(--line)}
.role-t{font-family:var(--font-display);font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role ul{margin:8px 0 0;padding-left:0;list-style:none;font-size:13.5px}
.role li{margin:4px 0;padding-left:18px;position:relative}
.role li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:1.5px;background:var(--yellow-deep)}
.role .note{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.badge{font-family:var(--font-mono);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;padding:2px 7px}
.badge.new{background:var(--yellow);color:#383E42}
.badge.moved{border:1px solid var(--text);color:var(--text)}
.badge.ended{background:var(--alt);color:var(--muted);border:1px solid var(--line);text-decoration:line-through}
.empty{color:var(--muted);font-style:italic;font-size:13.5px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:14px;padding:12px 20px;border:1.5px solid var(--yellow);background:var(--yellow);color:#383E42;transition:all .2s}
.btn:hover{background:transparent;color:var(--text)}

.events{list-style:none;margin:0;padding:0;position:relative}
.events::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.events li{position:relative;padding:0 0 18px 28px}
.events li button{all:unset;cursor:pointer;display:block}
.events li::before{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;background:var(--surface);border:1.5px solid var(--yellow-deep)}
.events li.act::before{background:var(--yellow)}
.events .d{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--accent-ink)}
.events .t{font-size:14px}
.events button:hover .t{color:var(--accent-ink)}
.events button:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cmp>div{padding:24px}
.cmp h3{font-size:18px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cmp .res-h{padding:8px 12px}
.cmp .role{padding:9px 12px}
.cmp .role-t{font-size:14px}

/* ---------- Desktop layout: events in hero, status in right-hand column ---------- */
.hero-side,.col-side{display:none}
@media (min-width:1100px){
  .wrap{max-width:1520px}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:48px;align-items:start}
  .hero-side{display:block;padding-bottom:40px}
  .hero-side .panel{background:var(--anthracite-2);border:1px solid rgba(255,255,255,.1);color:#fff}
  .hero-side .panel .sub{color:rgba(255,255,255,.55)}
  .hero-side .eyebrow{color:var(--yellow)}
  .hero-side .events::before{background:rgba(255,255,255,.15)}
  .hero-side .events li::before{background:var(--anthracite-2);border-color:var(--yellow)}
  .hero-side .events li.act::before{background:var(--yellow)}
  .hero-side .events .d,.hero-side .events button:hover .t{color:var(--yellow)}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;max-width:1520px;margin:0 auto;padding:0 clamp(16px,4vw,56px);align-items:start;
    --label-w:190px;--tl-minw:720px}
  .layout .wrap{padding:0;max-width:none}
  .lower-sec{display:none}
  .col-side{display:block;margin:56px 0}
  .col-side .panel{border-top:3px solid var(--yellow)}
  .layout .cmp>div{padding:0}
}

footer{background:var(--anthracite-3);color:rgba(255,255,255,.55);font-size:12.5px}
footer .wrap{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:28px;padding-bottom:28px}
footer img{height:34px;width:auto}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(3){padding-left:0;border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid rgba(255,255,255,.1)}
  .lower,.cmp{grid-template-columns:1fr}
  :root{--label-w:170px}
}
@media (max-width:520px){
  .nav img{height:30px}
  .nav .wrap{gap:8px}
  .seg button{padding:6px 9px}
  .scroll{padding:0 12px 6px}
  .hint{padding-left:12px;padding-right:12px}
  .kpi,.kpi+.kpi{padding:18px 12px 20px 0}
  .kpi:nth-child(2n){padding-left:12px}
  .panel,.cmp>div{padding:18px}
}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <img src="assets/norma-logo.png" alt="Norma Geosystems" width="221" height="44">
  <div class="sp"></div>
  <div class="seg" role="group" aria-label="Language">
    <button data-lang="no" aria-pressed="true">NO</button><button data-lang="en" aria-pressed="false">EN</button>
  </div>
  <div class="seg" role="group" aria-label="Theme">
    <button data-th="light" aria-pressed="false" title="Light">☀</button><button data-th="dark" aria-pressed="false" title="Dark">☾</button>
  </div>
</div></header>

<section class="hero"><div class="wrap hero-grid">
  <div class="hero-main">
    <div class="badge-live" data-i18n="kicker"></div>
    <h1 data-i18n-html="title"></h1>
    <p data-i18n="lead"></p>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="hero-side" id="slot-ev"></div>
</div></section>

<main class="layout">
 <div class="col-main">
  <section class="section"><div class="wrap">
    <div class="tl-head">
      <div><div class="eyebrow" data-i18n="ebTl"></div><h2 class="sec-title" data-i18n="tlTitle"></h2></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card tl">
      <div class="scroll" id="scroll">
        <div class="grid" id="grid"></div>
        <div class="scrub">
          <label for="range" data-i18n="scrub"></label>
          <input type="range" id="range" min="0" step="1">
        </div>
      </div>
      <div class="hint" data-i18n="hint"></div>
    </div>
  </div></section>

  <section class="section gray lower-sec"><div class="wrap">
    <div class="lower" id="lower">
      <section class="card panel" id="detail" aria-live="polite"></section>
      <section class="card panel" id="evPanel">
        <div class="eyebrow" data-i18n="ebEv"></div>
        <h2 data-i18n="evTitle"></h2>
        <div class="sub" data-i18n="evSub"></div>
        <ul class="events" id="events"></ul>
      </section>
    </div>
  </div></section>

  <section class="section"><div class="wrap">
    <div class="eyebrow" data-i18n="ebCmp"></div>
    <h2 class="sec-title" style="margin-bottom:28px" data-i18n="cmpTitle"></h2>
    <div class="cmp" id="cmp"></div>
  </div></section>
 </div>
 <aside class="col-side" id="slot-detail"></aside>
</main>
<footer><div class="wrap">
  <img src="assets/norma-logo-light.png" alt="Norma Geosystems" width="222" height="44" loading="lazy">
  <span data-i18n="foot"></span>
</div></footer>

<script>
/* ---------------- DATA (fra regnearket) ---------------- */
const D = s => new Date(s + "T00:00:00");
const T0 = D("2024-08-01"), T1 = D("2026-12-31"), TODAY = D("2026-11-09");

const PERIODS = [
  {id:"p1", from:"2024-08-01", to:"2025-08-06", label:{no:"Periode 1 · fra 01.08.2024", en:"Period 1 · from 01.08.2024"}},
  {id:"p2", from:"2025-08-07", to:null,         label:{no:"Periode 2 · fra 07.08.2025", en:"Period 2 · from 07.08.2025"}}
];

const DUTIES = {
  leder:[
    ["Konsultasjonstjenester knyttet til stikning – tilbys uten ekstra kostnad.","Consulting services related to setting-out – provided at no extra cost."],
    ["Rådgivning vedrørende valg av software, utstyr og metodikk.","Advice on the choice of software, equipment and methodology."],
    ["Overvåkning og kvalitetssikring av geomatiske data.","Monitoring and quality assurance of geomatic data."],
    ["Proaktiv innsats for å oppfylle prosjektets spesifikasjoner og kvalitetskrav.","Proactive effort to meet the project's specifications and quality requirements."],
    ["Utførelse av både regelmessige og sporadiske oppmålingsoppdrag.","Execution of both regular and ad-hoc survey assignments."],
    ["Fleksibel arbeidstid på stedet ved behov.","Flexible on-site working hours as needed."],
    ["Support av NORMA Geosystems’ ressurser etter behov.","Support from NORMA Geosystems' resources as needed."]
  ],
  mengde:[
    ["Mengdeberegning: Nøyaktig kalkulasjon og verifisering av materialer og volumer.","Quantity surveying: accurate calculation and verification of materials and volumes."],
    ["Målebrev: Utarbeidelse og kontroll av delmålebrev og målebrev.","Measurement statements (målebrev): preparation and checking of interim and final statements."],
    ["Datahåndtering: Effektiv styring og organisering av prosjektdatabaser.","Data management: efficient management and organisation of project databases."],
    ["Leveranser: Pålitelig og rettidig levering av alle nødvendige rapporter og dokumentasjon.","Deliverables: reliable and timely delivery of all required reports and documentation."]
  ],
  felt:[
    ["Utstikking av linjer, punkter og profiler.","Setting-out of lines, points and profiles."],
    ["As-built målinger og produksjon av nødvendig dokumentasjon.","As-built surveys and production of the required documentation."],
    ["Løpende fremdrifts- og kvalitetskontroll.","Ongoing progress and quality control."],
    ["Etablering, måling og vedlikehold av grunnlagsnett.","Establishment, measurement and maintenance of the survey control network."],
    ["Fremdrifts- og deformasjonskontroll i tunnel.","Progress and deformation monitoring in the tunnel."],
    ["Fleksibel bistand til øvrige stikningsrelaterte oppgaver etter behov.","Flexible assistance with other setting-out related tasks as needed."],
    ["Tett rapportering til stikningsleder (Ressurs 1) og samhandling med prosjektets mengdeberegner (Ressurs 2).","Close reporting to the setting-out lead (Resource 1) and collaboration with the project's quantity surveyor (Resource 2)."]
  ],
  panorama:[["360° Panorama-bilder for visuell dokumentasjon.","360° panoramic images for visual documentation."]],
  drone:[], foto:[], prosj:[], geo:[]
};

const RES = [
  {id:"r1", color:"var(--r1)", ink:"var(--r1-ink)", name:{no:"Ressurs 1",en:"Resource 1"}},
  {id:"r2", color:"var(--r2)", ink:"var(--r2-ink)", name:{no:"Ressurs 2",en:"Resource 2"}},
  {id:"r3", color:"var(--r3)", ink:"var(--r3-ink)", name:{no:"Ressurs 3",en:"Resource 3"}},
  {id:"sh", color:"var(--shared)", ink:"var(--shared-ink)", name:{no:"Felles tjenester",en:"Shared services"}, shared:true}
];

/* Hver "lane" = én rolle; segments = tidsrom (per periode) */
const LANES = [
  {res:"r1", duty:"leder", name:{no:"Stikningsleder",en:"Setting-out lead"},
    seg:[{from:"2024-08-01",to:"2025-08-06",p:"p1"},{from:"2025-08-07",to:null,p:"p2"}]},
  {res:"r2", duty:"mengde", name:{no:"Mengdeberegner",en:"Quantity surveyor"},
    seg:[{from:"2024-08-01",to:"2025-08-06",p:"p1"},{from:"2025-08-07",to:null,p:"p2"}]},
  {res:"r2", duty:"felt", name:{no:"Feltstiker",en:"Field surveyor"},
    seg:[{from:"2024-09-01",to:"2025-08-06",p:"p1",
      note:{no:"Utført av Ressurs 2 i tillegg til mengdeberegning.",en:"Performed by Resource 2 alongside quantity surveying."}}]},
  {res:"r2", duty:"drone", name:{no:"Drone flyvning",en:"Drone flights"},
    seg:[{from:"2024-08-01",to:"2024-12-31",p:"p1"}]},
  {res:"r2", duty:"foto", name:{no:"Fotogrammetri prosessering",en:"Photogrammetry processing"},
    seg:[{from:"2024-08-01",to:"2024-12-31",p:"p1"}]},
  {res:"r3", duty:"felt", name:{no:"Feltstikkere (rotasjon 14/14)",en:"Field surveyors (14/14 rotation)"},
    seg:[{from:"2025-08-07",to:null,p:"p2", badge:"moved",
      note:{no:"Feltstikking flyttet fra Ressurs 2 til egen ressurs med rotasjonsordning 14/14.",en:"Field setting-out moved from Resource 2 to a dedicated resource on a 14/14 rotation."}}]},
  {res:"r3", duty:"panorama", name:{no:"Panorama 360",en:"Panorama 360"},
    seg:[{from:"2025-08-07",to:null,p:"p2", badge:"new"}]},
  {res:"sh", duty:"prosj", name:{no:"Prosjektering støtte",en:"Design support"},
    seg:[{from:"2024-08-01",to:null,p:"both"}]},
  {res:"sh", duty:"geo", name:{no:"Geometrisk monitorering",en:"Geometric monitoring"},
    seg:[{from:"2024-08-01",to:null,p:"both"}]}
];

const EVENTS = [
  {d:"2024-08-01", t:{no:"Oppstart. Ressurs 1 (stikningsleder) og Ressurs 2 (mengdeberegning, drone og fotogrammetri).",en:"Start. Resource 1 (setting-out lead) and Resource 2 (quantity surveying, drone and photogrammetry)."}},
  {d:"2024-09-01", t:{no:"Ressurs 2 tar i tillegg rollen som feltstiker.",en:"Resource 2 additionally takes on the field surveyor role."}},
  {d:"2024-12-31", t:{no:"Droneflyging og fotogrammetri-prosessering avsluttes.",en:"Drone flights and photogrammetry processing end."}},
  {d:"2025-08-07", t:{no:"Ny periode: Ressurs 3 innføres – feltstikkere i rotasjon 14/14 og 360° panorama. Ressurs 2 fokuserer på mengdeberegning.",en:"New period: Resource 3 introduced – field surveyors on a 14/14 rotation and 360° panoramas. Resource 2 focuses on quantity surveying."}},
  {d:"2026-11-09", t:{no:"I dag – Periode 2 pågår.",en:"Today – Period 2 ongoing."}}
];

const I18N = {
  no:{kicker:"OHLA · Stikning og oppmåling · 2024–2026",title:"Ressursfordeling <span class=\"accent\">over tid</span>",ebTl:"Tidslinje",ebEv:"Hendelser",ebCmp:"Periode 1 vs. periode 2",cursor:"Valgt dato",
    lead:"Hvordan antall ressurser og ansvarsområdene til hver ressurs har endret seg over tid. Dra i tidslinjen, klikk på en rolle eller en hendelse for detaljer.",
    tlTitle:"Tidslinje for ressurser og roller",scrub:"Velg dato",
    hint:"Tips: klikk/dra i tidslinjen for å flytte markøren, klikk på en stolpe for å se oppgavene til rollen.",
    evTitle:"Viktige endringer",evSub:"Klikk for å hoppe til datoen.",
    cmpTitle:"Sammenligning av periodene",foot:"Kilde: ressursoversikt (regneark). Felles tjenester er vist for hele perioden uten fast ressurstilknytning.",
    kRes:"Ressurser nå",kRoles:"Aktive roller",kDuties:"Oppgaver",kPer:"Periode",of:"av",
    at:"Status per",active:"Aktive ressurser og roller",noDuties:"Ingen detaljert oppgaveliste i kildedokumentet.",
    ongoing:"pågående",new:"Ny",moved:"Flyttet",ended:"Avsluttet",today:"I dag",
    roleSel:"Valgt rolle",back:"Vis status for dato",
    removed:"Ikke videreført",legendShared:"Felles tjenester",
    sel:"Klikk på en annen stolpe eller hendelse for å bytte."},
  en:{kicker:"OHLA · Setting-out and surveying · 2024–2026",title:"Resource allocation <span class=\"accent\">over time</span>",ebTl:"Timeline",ebEv:"Events",ebCmp:"Period 1 vs. period 2",cursor:"Selected date",
    lead:"How the number of resources and the responsibilities of each resource have changed over time. Drag the timeline, or click a role or an event for details.",
    tlTitle:"Timeline of resources and roles",scrub:"Select date",
    hint:"Tip: click/drag on the timeline to move the marker; click a bar to see the role's tasks.",
    evTitle:"Key changes",evSub:"Click to jump to the date.",
    cmpTitle:"Comparison of the periods",foot:"Source: resource overview (spreadsheet). Shared services are shown for the whole period without a fixed resource assignment.",
    kRes:"Resources now",kRoles:"Active roles",kDuties:"Tasks",kPer:"Period",of:"of",
    at:"Status as of",active:"Active resources and roles",noDuties:"No detailed task list in the source document.",
    ongoing:"ongoing",new:"New",moved:"Moved",ended:"Ended",today:"Today",
    roleSel:"Selected role",back:"Show status for",
    removed:"Discontinued",legendShared:"Shared services",
    sel:"Click another bar or event to switch."}
};

/* ---------------- STATE ---------------- */
const DAY = 864e5;
const SPAN = (T1 - T0) / DAY;
let lang = "no", cur = TODAY, sel = null;
try { lang = localStorage.getItem("ohla-lang") || "no"; if (!I18N[lang]) lang = "no"; } catch(e){}

const $ = s => document.querySelector(s);
const pct = d => ((d - T0) / DAY) / SPAN * 100;
const segEnd = s => s.to ? D(s.to) : T1;
const fmt = d => d.toLocaleDateString("nb-NO", {day:"2-digit",month:"2-digit",year:"numeric"});
const t = k => I18N[lang][k];
const resOf = id => RES.find(r => r.id === id);
const dutyText = (k) => DUTIES[k].map(x => lang === "en" ? x[1] : x[0]);
const isActive = (s, d) => d >= D(s.from) && d <= segEnd(s);
const periodAt = d => PERIODS.find(p => d >= D(p.from) && (!p.to || d <= D(p.to)));

/* ---------------- RENDER: timeline ---------------- */
function buildGrid(){
  const g = $("#grid"); g.innerHTML = "";
  const row = (cls, labHTML, trackHTML) => {
    g.insertAdjacentHTML("beforeend", `<div class="lab ${cls}">${labHTML}</div><div class="track ${cls}">${trackHTML}</div>`);
  };
  // years
  const years = []; const months = [];
  for (let d = new Date(T0); d <= T1; d = new Date(d.getFullYear(), d.getMonth()+1, 1)){
    const next = new Date(d.getFullYear(), d.getMonth()+1, 1);
    const w = (Math.min(next, new Date(+T1 + DAY)) - d) / DAY / SPAN * 100;
    months.push(`<div style="width:${w}%">${d.getMonth()+1}</div>`);
    const y = years[years.length-1];
    if (y && y.y === d.getFullYear()) y.w += w; else years.push({y:d.getFullYear(), w});
  }
  g.insertAdjacentHTML("beforeend", `<div class="lab years"></div><div class="track years">${years.map(y=>`<div style="width:${y.w}%">${y.y}</div>`).join("")}</div>`);
  g.insertAdjacentHTML("beforeend", `<div class="lab months"></div><div class="track months">${months.join("")}</div>`);
  // periods
  row("periods row-sep", "", PERIODS.map(p => {
    const l = pct(D(p.from)), r = pct(p.to ? D(p.to) : T1);
    return `<button class="pband ${p.id} ${p.to?"":"open"}" style="left:${l}%;width:${r-l}%" data-jump="${p.from}">${p.label[lang]}</button>`;
  }).join(""));
  // groups + lanes
  RES.forEach(r => {
    row("group row-sep", `<span class="dot" style="background:${r.color}"></span>${r.name[lang]}`, "");
    LANES.filter(l => l.res === r.id).forEach((l, i) => {
      const li = LANES.indexOf(l);
      const bars = l.seg.map((s, si) => {
        const a = pct(D(s.from)), b = pct(segEnd(s) - 0 + DAY);
        const badge = s.badge ? `<span class="tag">${t(s.badge)}</span>` : "";
        return `<button class="bar ${r.shared?"shared":""} ${s.to?"":"open"}" data-l="${li}" data-s="${si}"
          style="left:${a}%;width:${Math.min(b,100)-a}%;background-color:${r.color};color:${r.ink}"
          title="${l.name[lang]} · ${fmt(D(s.from))} – ${s.to?fmt(D(s.to)):t("ongoing")}">${l.name[lang]}${badge}</button>`;
      }).join("");
      row("lane", l.name[lang], bars);
    });
  });
  // overlay with today line, period divider, cursor (spans track column)
  g.insertAdjacentHTML("beforeend", `<div class="overlay" id="ov" style="left:var(--label-w)">
     <div class="vline" style="left:${pct(D("2025-08-07"))}%"></div>
     <div class="vline today" style="left:${pct(TODAY)}%"><span>${t("today")}</span></div>
     <div class="cursor" id="cursor"></div></div>`);
  $("#ov").style.right = "0";
  g.querySelectorAll(".bar").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    sel = {l:+b.dataset.l, s:+b.dataset.s};
    const s = LANES[sel.l].seg[sel.s];
    if (!isActive(s, cur)) cur = new Date(Math.max(D(s.from), Math.min(segEnd(s), TODAY)));
    update();
  }));
  g.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); sel=null; cur = D(b.dataset.jump); update(); }));
  // drag-to-scrub on track area
  let drag = false;
  const setFromX = x => {
    const tr = g.querySelector(".track.months").getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (x - tr.left) / tr.width));
    cur = new Date(+T0 + Math.round(f * SPAN) * DAY); sel = null; update();
  };
  g.addEventListener("pointerdown", e => {
    if (e.target.closest(".bar,.pband") || !e.target.closest(".track")) return;
    drag = true; g.setPointerCapture(e.pointerId); setFromX(e.clientX);
  });
  g.addEventListener("pointermove", e => drag && setFromX(e.clientX));
  g.addEventListener("pointerup", () => drag = false);
}

/* ---------------- RENDER: other parts ---------------- */
function activeAt(d){
  const out = [];
  LANES.forEach((l, li) => l.seg.forEach((s, si) => { if (isActive(s, d)) out.push({l, s, li, si}); }));
  return out;
}
function roleBlock(l, s, extra=""){
  const duties = dutyText(l.duty);
  const badge = s.badge ? `<span class="badge ${s.badge}">${t(s.badge)}</span>` : "";
  return `<div class="role"><div class="role-t">${l.name[lang]} ${badge}</div>
    <div class="note">${fmt(D(s.from))} – ${s.to ? fmt(D(s.to)) : t("ongoing")}${s.note ? " · " + s.note[lang] : ""}</div>
    ${duties.length ? `<ul>${duties.map(x=>`<li>${x}</li>`).join("")}</ul>` : `<div class="empty">${t("noDuties")}</div>`}${extra}</div>`;
}
function groupByRes(list, compact){
  return RES.map(r => {
    const items = list.filter(x => x.l.res === r.id);
    if (!items.length) return "";
    return `<div class="res"><div class="res-h" style="background:${r.color};color:${r.ink}">${r.name[lang]}</div>
      ${items.map(x => compact ? compactRole(x) : roleBlock(x.l, x.s)).join("")}</div>`;
  }).join("");
}
function compactRole(x){
  const n = DUTIES[x.l.duty].length;
  const badge = x.s.badge ? ` <span class="badge ${x.s.badge}">${t(x.s.badge)}</span>` : (x.ended ? ` <span class="badge ended">${t("ended")}</span>` : "");
  return `<div class="role"><div class="role-t">${x.l.name[lang]}${badge}</div>
    <div class="note">${n ? n + " " + t("kDuties").toLowerCase() : t("noDuties")}${x.s.note ? " · " + x.s.note[lang] : ""}</div></div>`;
}

function renderKpis(){
  const act = activeAt(cur);
  const res = new Set(act.filter(x => x.l.res !== "sh").map(x => x.l.res));
  const roles = act.filter(x => x.l.res !== "sh").length;
  const duties = act.reduce((a, x) => a + DUTIES[x.l.duty].length, 0);
  const p = periodAt(cur);
  $("#kpis").innerHTML = [
    [t("kRes"), `${res.size}`, fmt(cur)],
    [t("kRoles"), `${roles}`, `+ ${act.length-roles} ${t("legendShared").toLowerCase()}`],
    [t("kDuties"), `${duties}`, t("active").toLowerCase()],
    [t("kPer"), p ? (p.id === "p1" ? "1" : "2") + ` <small>${t("of")} 2</small>` : "–", p ? p.label[lang].split("·")[1] : ""]
  ].map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join("");
}

function renderDetail(){
  const el = $("#detail");
  if (sel){
    const l = LANES[sel.l], s = l.seg[sel.s], r = resOf(l.res);
    el.innerHTML = `<h2>${t("roleSel")}</h2><div class="sub">${t("sel")}</div>
      <div class="res"><div class="res-h" style="background:${r.color};color:${r.ink}">${r.name[lang]}</div>${roleBlock(l, s)}</div>
      <button class="btn" id="back">${t("back")} ${fmt(cur)} <span>→</span></button>`;
    $("#back").onclick = () => { sel = null; update(); };
    return;
  }
  const p = periodAt(cur);
  el.innerHTML = `<h2>${t("at")} ${fmt(cur)}</h2>
    <div class="sub">${p ? `<span class="pill ${p.id}">${p.label[lang]}</span>` : ""}</div>
    ${groupByRes(activeAt(cur))}`;
}

function renderEvents(){
  $("#events").innerHTML = EVENTS.map(e => `<li class="${+D(e.d)===+cur?"act":""}"><button data-d="${e.d}">
    <div class="d">${fmt(D(e.d))}</div><div class="t">${e.t[lang]}</div></button></li>`).join("");
  document.querySelectorAll("#events button").forEach(b => b.onclick = () => { sel = null; cur = D(b.dataset.d); update(); });
}

function renderCompare(){
  const col = p => {
    const list = [];
    LANES.forEach(l => l.seg.forEach(s => { if (s.p === p.id || s.p === "both") list.push({l, s, ended: p.id==="p1" && s.to && D(s.to) < D(p.to)}); }));
    const res = new Set(list.filter(x=>x.l.res!=="sh").map(x=>x.l.res)).size;
    return `<div><h3><span class="pill ${p.id}">${p.label[lang]}</span> ${res} ${lang==="en"?"resources":"ressurser"}</h3>${groupByRes(list, true)}</div>`;
  };
  $("#cmp").innerHTML = PERIODS.map(col).join("");
}

function renderLegend(){
  $("#legend").innerHTML = RES.map(r => `<span><b style="background:${r.color}"></b>${r.name[lang]}</span>`).join("")
    + `<span><b style="background:var(--yellow)"></b>${t("cursor")}</span>`;
}

function update(){
  const r = $("#range");
  r.value = Math.round((cur - T0) / DAY);
  $("#cursor").style.left = pct(cur) + "%";
  document.querySelectorAll(".bar").forEach(b => {
    const s = LANES[+b.dataset.l].seg[+b.dataset.s];
    b.classList.toggle("dim", !isActive(s, cur));
    b.classList.toggle("sel", !!sel && sel.l === +b.dataset.l && sel.s === +b.dataset.s);
  });
  renderKpis(); renderDetail(); renderEvents();
}

function applyLang(){
  document.documentElement.lang = lang === "en" ? "en" : "no";
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(e => e.innerHTML = t(e.dataset.i18nHtml));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  buildGrid(); renderLegend(); renderCompare(); update();
}

/* ---------------- INIT ---------------- */
$("#range").max = Math.round(SPAN);
$("#range").addEventListener("input", e => { sel = null; cur = new Date(+T0 + e.target.value * DAY); update(); });
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem("ohla-lang", lang); } catch(e){} applyLang();
});
document.querySelectorAll("[data-th]").forEach(b => b.onclick = () => {
  const on = b.getAttribute("aria-pressed") !== "true";
  document.querySelectorAll("[data-th]").forEach(x => x.setAttribute("aria-pressed","false"));
  if (on){ document.documentElement.dataset.theme = b.dataset.th; b.setAttribute("aria-pressed","true"); }
  else delete document.documentElement.dataset.theme;
});
applyLang();
/* Desktop: events -> hero, status -> sidebar. Mobile: both back to the gray section. */
const mq = matchMedia("(min-width:1100px)");
function place(){
  if (mq.matches){ $("#slot-ev").append($("#evPanel")); $("#slot-detail").append($("#detail")); }
  else { $("#lower").append($("#detail"), $("#evPanel")); }
}
mq.addEventListener("change", place); place();
// scroll timeline so "today" is visible on narrow screens
requestAnimationFrame(() => { const sc = $("#scroll"); sc.scrollLeft = sc.scrollWidth; });
</script>
</body>
</html>
